version: '3.8'

services:
  # Ollama service (optional, disabled for now)
#  ollama:
#    image: ollama/ollama:latest
#    container_name: incident-assistant-ollama
#    ports:
#      - "11434:11434"
#    volumes:
#      - ollama_data:/root/.ollama
#    restart: unless-stopped
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
#      interval: 30s
#      timeout: 10s
#      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile.docker
    container_name: incident-assistant-api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-mpnet-base-v2}
    volumes:
      - ./data:/app/data
      - ./.chromadb:/app/.chromadb
      - ./ingested_files:/app/ingested_files
      - ./source_files:/app/source_files
      - ./logs:/app/logs
#    depends_on:
#      ollama:
#        condition: service_healthy
    restart: unless-stopped
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000 --workers 4

  frontend:
    image: python:3.11-slim
    container_name: incident-assistant-frontend
    working_dir: /app
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api
    restart: unless-stopped
    command: bash -c "pip install -r requirements.txt && streamlit run src/app.py --server.port=8501 --server.address=0.0.0.0"

  nginx:
    image: nginx:alpine
    container_name: incident-assistant-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local