providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "curl"]

[start]
cmd = "python run_api.py"

[variables]
PYTHONUNBUFFERED = "1"
PYTHONPATH = "/app"
# Clear offline flags to allow runtime downloads (models download at runtime, not build time)
TRANSFORMERS_OFFLINE = "0"
HF_HUB_OFFLINE = "0"
TRANSFORMERS_CACHE = "/app/.cache/transformers"
SENTENCE_TRANSFORMERS_HOME = "/app/.cache/sentence-transformers"
EMBEDDING_MODEL = "all-MiniLM-L6-v2"
# LLM model selection (Ollama)
# Options: phi3:mini (recommended, ~2.3GB), llama3.2:3b (~2GB), gemma2:2b (~1.5GB), qwen2.5:3b (~2GB), mistral (~4.1GB)
LLM_MODEL = "phi3:mini"
# Memory optimizations for Railway deployment
PYTHONHASHSEED = "0"
# Reduce ChromaDB memory usage
CHROMA_CACHE_SIZE = "100"
# Limit Python memory usage (optional, Railway may override)
MALLOC_TRIM_THRESHOLD_ = "65536"

