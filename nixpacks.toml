providers = ["python"]

[phases.setup]
nixPkgs = ["curl"]

# Prevent model downloads during build - models will download at runtime
[phases.install]
cmds = [
  "TRANSFORMERS_OFFLINE=1 HF_HUB_OFFLINE=1 HF_DATASETS_OFFLINE=1 SENTENCE_TRANSFORMERS_HOME=/tmp pip install --no-cache-dir --upgrade pip",
  "TRANSFORMERS_OFFLINE=1 HF_HUB_OFFLINE=1 HF_DATASETS_OFFLINE=1 SENTENCE_TRANSFORMERS_HOME=/tmp pip install --no-cache-dir -r requirements.txt",
  "rm -rf /root/.cache/huggingface /root/.cache/torch /root/.cache/pip /tmp/.cache /tmp/sentence-transformers 2>/dev/null || true",
  "find /opt/venv -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true",
  "find /opt/venv -name '*.pyc' -delete 2>/dev/null || true"
]

[start]
cmd = "python run_api.py"

[variables]
PYTHONUNBUFFERED = "1"
PYTHONPATH = "/app"
# Clear offline flags to allow runtime downloads (models download at runtime, not build time)
TRANSFORMERS_OFFLINE = "0"
HF_HUB_OFFLINE = "0"
TRANSFORMERS_CACHE = "/app/.cache/transformers"
SENTENCE_TRANSFORMERS_HOME = "/app/.cache/sentence-transformers"
EMBEDDING_MODEL = "all-MiniLM-L6-v2"

