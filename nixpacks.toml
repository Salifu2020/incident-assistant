providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "curl"]

# Clean up model caches after Nixpacks' automatic installation
# These commands run after Nixpacks installs dependencies to reduce image size
[phases.install]
cmds = [
  "rm -rf /root/.cache/huggingface /root/.cache/torch /root/.cache/pip /tmp/.cache /tmp/sentence-transformers 2>/dev/null || true",
  "find /opt/venv/lib/python3.11/site-packages -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true",
  "find /opt/venv/lib/python3.11/site-packages -name '*.pyc' -delete 2>/dev/null || true",
  "find /opt/venv/lib/python3.11/site-packages -type d -name 'models' -exec rm -rf {} + 2>/dev/null || true",
  "find /opt/venv/lib/python3.11/site-packages -path '*/sentence_transformers/.cache' -type d -exec rm -rf {} + 2>/dev/null || true"
]

[start]
cmd = "python run_api.py"

[variables]
PYTHONUNBUFFERED = "1"
PYTHONPATH = "/app"
# Clear offline flags to allow runtime downloads (models download at runtime, not build time)
TRANSFORMERS_OFFLINE = "0"
HF_HUB_OFFLINE = "0"
TRANSFORMERS_CACHE = "/app/.cache/transformers"
SENTENCE_TRANSFORMERS_HOME = "/app/.cache/sentence-transformers"
EMBEDDING_MODEL = "all-MiniLM-L6-v2"

